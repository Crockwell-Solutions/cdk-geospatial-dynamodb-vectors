<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Turning a position report into a four-dimensional vector">
<title>Turning a position report into a four-dimensional vector</title>
<desc>Longitude and latitude are projected to kilometres east and north, altitude is multiplied by 9.26 km per 1,000 ft, and time becomes seconds since midnight multiplied by 0.25 km per second.</desc>
<defs>
  <marker id="arrow-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5" fill="none" stroke="#898781" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arrow-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5" fill="none" stroke="#f0efec" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5" fill="none" stroke="#3987e5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arrow-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5" fill="none" stroke="#d95926" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arrow-aqua" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5" fill="none" stroke="#199e70" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="1200" height="560" rx="16" fill="#0b0f14"/>
<text x="48" y="58" font-size="26" fill="#f0efec" font-weight="700" text-anchor="start">From a position report to a point in 4D</text><text x="48" y="88" font-size="16" fill="#c3c2b7" font-weight="400" text-anchor="start">Every dimension ends up in kilometres, so one straight-line distance can compare them all.</text><rect x="48" y="124" width="540" height="78" rx="10" fill="#19202a" stroke="rgba(255,255,255,0.10)" stroke-width="1"/><text x="68" y="152" font-size="13.5" fill="#898781" font-weight="400" text-anchor="start">Longitude, latitude</text><text x="68" y="182" font-size="19" fill="#f0efec" font-weight="400" text-anchor="start" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace">2.3522°E, 48.8566°N</text><rect x="612" y="124" width="258" height="78" rx="10" fill="#19202a" stroke="rgba(255,255,255,0.10)" stroke-width="1"/><text x="632" y="152" font-size="13.5" fill="#898781" font-weight="400" text-anchor="start">Altitude</text><text x="632" y="182" font-size="19" fill="#f0efec" font-weight="400" text-anchor="start" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace">35,000 ft</text><rect x="894" y="124" width="258" height="78" rx="10" fill="#19202a" stroke="rgba(255,255,255,0.10)" stroke-width="1"/><text x="914" y="152" font-size="13.5" fill="#898781" font-weight="400" text-anchor="start">Time</text><text x="914" y="182" font-size="19" fill="#f0efec" font-weight="400" text-anchor="start" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace">14:41:00 UTC</text><line x1="177" y1="210" x2="177" y2="246" stroke="#898781" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow-muted)"/><text x="177" y="274" font-size="14.5" fill="#c3c2b7" font-weight="400" text-anchor="middle">Lambert-93 projection:</text><text x="177" y="295" font-size="14.5" fill="#c3c2b7" font-weight="400" text-anchor="middle">kilometres east of 3°E</text><line x1="177" y1="312" x2="177" y2="348" stroke="#898781" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow-muted)"/><rect x="48" y="356" width="258" height="124" rx="12" fill="#11161d" stroke="rgba(255,255,255,0.22)" stroke-width="1.5"/><text x="177" y="392" font-size="20" fill="#f0efec" font-weight="700" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace">x</text><text x="177" y="432" font-size="26" fill="#f0efec" font-weight="600" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace">-47.531</text><text x="177" y="460" font-size="13.5" fill="#898781" font-weight="400" text-anchor="middle">km east</text><line x1="459" y1="210" x2="459" y2="246" stroke="#898781" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow-muted)"/><text x="459" y="274" font-size="14.5" fill="#c3c2b7" font-weight="400" text-anchor="middle">Lambert-93 projection:</text><text x="459" y="295" font-size="14.5" fill="#c3c2b7" font-weight="400" text-anchor="middle">kilometres north of 46.5°N</text><line x1="459" y1="312" x2="459" y2="348" stroke="#898781" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow-muted)"/><rect x="330" y="356" width="258" height="124" rx="12" fill="#11161d" stroke="rgba(255,255,255,0.22)" stroke-width="1.5"/><text x="459" y="392" font-size="20" fill="#f0efec" font-weight="700" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace">y</text><text x="459" y="432" font-size="26" fill="#f0efec" font-weight="600" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace">262.035</text><text x="459" y="460" font-size="13.5" fill="#898781" font-weight="400" text-anchor="middle">km north</text><line x1="741" y1="210" x2="741" y2="246" stroke="#898781" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow-muted)"/><text x="741" y="274" font-size="14.5" fill="#c3c2b7" font-weight="400" text-anchor="middle">× 9.26 km per 1,000 ft</text><text x="741" y="295" font-size="14.5" fill="#c3c2b7" font-weight="400" text-anchor="middle">so 1,000 ft counts as 5 NM</text><line x1="741" y1="312" x2="741" y2="348" stroke="#898781" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow-muted)"/><rect x="612" y="356" width="258" height="124" rx="12" fill="#11161d" stroke="rgba(255,255,255,0.22)" stroke-width="1.5"/><text x="741" y="392" font-size="20" fill="#f0efec" font-weight="700" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace">z</text><text x="741" y="432" font-size="26" fill="#f0efec" font-weight="600" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace">324.100</text><text x="741" y="460" font-size="13.5" fill="#898781" font-weight="400" text-anchor="middle">km (scaled)</text><line x1="1023" y1="210" x2="1023" y2="246" stroke="#898781" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow-muted)"/><text x="1023" y="274" font-size="14.5" fill="#c3c2b7" font-weight="400" text-anchor="middle">seconds since midnight</text><text x="1023" y="295" font-size="14.5" fill="#c3c2b7" font-weight="400" text-anchor="middle">× 0.25 km per second</text><line x1="1023" y1="312" x2="1023" y2="348" stroke="#898781" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow-muted)"/><rect x="894" y="356" width="258" height="124" rx="12" fill="#11161d" stroke="#d95926" stroke-width="1.5"/><text x="1023" y="392" font-size="20" fill="#d95926" font-weight="700" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace">t</text><text x="1023" y="432" font-size="26" fill="#f0efec" font-weight="600" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace">13,215.000</text><text x="1023" y="460" font-size="13.5" fill="#898781" font-weight="400" text-anchor="middle">km (scaled)</text><text x="48" y="524" font-size="16" fill="#c3c2b7">Stored on the item as an ordinary list attribute:  <tspan font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" fill="#f0efec">"vec": [-47.531, 262.035, 324.1, 13215]</tspan></text>
</svg>
