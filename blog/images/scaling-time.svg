<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Scaling time at 250 metres per second">
<title>Scaling time at 250 metres per second</title>
<desc>A space-time diagram showing that the same place one minute later and a point 15 km ahead at the same time are equally far from the aircraft in the vector index.</desc>
<defs>
  <marker id="arrow-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5" fill="none" stroke="#898781" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arrow-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5" fill="none" stroke="#f0efec" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5" fill="none" stroke="#3987e5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arrow-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5" fill="none" stroke="#d95926" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arrow-aqua" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5" fill="none" stroke="#199e70" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="1200" height="470" rx="16" fill="#0b0f14"/>
<text x="48" y="58" font-size="26" fill="#f0efec" font-weight="700" text-anchor="start">One second is 250 metres</text><text x="48" y="88" font-size="16" fill="#c3c2b7" font-weight="400" text-anchor="start">Time needs an exchange rate into distance. The natural one is the speed of the thing you are tracking.</text><rect x="48" y="116" width="620" height="322" rx="12" fill="#11161d" stroke="rgba(255,255,255,0.10)" stroke-width="1"/><line x1="150" y1="392" x2="620" y2="392" stroke="#383835" stroke-width="1" stroke-linecap="round"/><line x1="150" y1="392" x2="150" y2="142" stroke="#383835" stroke-width="1" stroke-linecap="round"/><text x="620" y="416" font-size="13" fill="#898781" font-weight="400" text-anchor="end">distance along the route</text><text x="138" y="152" font-size="13" fill="#898781" font-weight="400" text-anchor="end">time</text><line x1="315" y1="392" x2="315" y2="398" stroke="#383835" stroke-width="1" stroke-linecap="round"/><text x="315" y="416" font-size="13" fill="#898781" font-weight="400" text-anchor="middle">15 km</text><line x1="144" y1="227" x2="150" y2="227" stroke="#383835" stroke-width="1" stroke-linecap="round"/><text x="138" y="231" font-size="13" fill="#898781" font-weight="400" text-anchor="end">+1 min</text><line x1="150" y1="392" x2="282" y2="260" stroke="#d95926" stroke-width="2" stroke-linecap="round"/><text x="294" y="262" font-size="13.5" fill="#c3c2b7" font-weight="400" text-anchor="start">our flight: 15 km every minute</text><path d="M 315 392 A 165 165 0 0 0 150 227" fill="none" stroke="#3987e5" stroke-width="1.5"/><circle cx="150" cy="392" r="6" fill="#d95926" stroke="#11161d" stroke-width="2"/><text x="164" y="416" font-size="14" fill="#f0efec" font-weight="600" text-anchor="start">here, now</text><circle cx="315" cy="392" r="5" fill="#f0efec" stroke="#11161d" stroke-width="2"/><text x="327" y="378" font-size="14" fill="#f0efec" font-weight="600" text-anchor="start">same time, 15 km ahead</text><circle cx="150" cy="227" r="5" fill="#f0efec" stroke="#11161d" stroke-width="2"/><text x="162" y="215" font-size="14" fill="#f0efec" font-weight="600" text-anchor="start">same place, one minute later</text><text x="319.1" y="332.6" font-size="13.5" fill="#9ec5f4" font-weight="400" text-anchor="start">equally far away</text><text x="319.1" y="350.6" font-size="13.5" fill="#9ec5f4" font-weight="400" text-anchor="start">in the index</text><text x="708" y="150" font-size="19" fill="#f0efec" font-weight="700" text-anchor="start">Why it matters</text><text x="708" y="184" font-size="15.5" fill="#c3c2b7" font-weight="400" text-anchor="start">Two aircraft can fly through exactly the same</text><text x="708" y="207" font-size="15.5" fill="#c3c2b7" font-weight="400" text-anchor="start">point and never be near each other, if they do</text><text x="708" y="230" font-size="15.5" fill="#c3c2b7" font-weight="400" text-anchor="start">it ten minutes apart.</text><text x="708" y="270" font-size="15.5" fill="#c3c2b7" font-weight="400" text-anchor="start">A jet covers about 250 m each second. Use that</text><text x="708" y="293" font-size="15.5" fill="#c3c2b7" font-weight="400" text-anchor="start">as the exchange rate and a position report a</text><text x="708" y="316" font-size="15.5" fill="#c3c2b7" font-weight="400" text-anchor="start">minute away in time is as far off as one 15 km</text><text x="708" y="339" font-size="15.5" fill="#c3c2b7" font-weight="400" text-anchor="start">away in space, which is where that aircraft</text><text x="708" y="362" font-size="15.5" fill="#c3c2b7" font-weight="400" text-anchor="start">actually was.</text><text x="708" y="412" font-size="15.5" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" fill="#f0efec">t = seconds since midnight × 0.25</text>
</svg>
