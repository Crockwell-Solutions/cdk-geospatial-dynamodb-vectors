<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Position reports are sparse, so the nearest stored points are not the closest approach">
<title>Position reports are sparse, so the nearest stored points are not the closest approach</title>
<desc>Two flight tracks cross at a moment when neither has a position report. The nearest pair of stored reports is several kilometres and 23 seconds apart.</desc>
<defs>
  <marker id="arrow-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5" fill="none" stroke="#898781" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arrow-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5" fill="none" stroke="#f0efec" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5" fill="none" stroke="#3987e5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arrow-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5" fill="none" stroke="#d95926" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arrow-aqua" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5" fill="none" stroke="#199e70" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="1200" height="560" rx="16" fill="#0b0f14"/>
<text x="48" y="58" font-size="26" fill="#f0efec" font-weight="700" text-anchor="start">The catch: position reports are a minute apart</text><text x="48" y="88" font-size="16" fill="#c3c2b7" font-weight="400" text-anchor="start">Two aircraft cross. Neither reports its position at the moment it matters.</text><rect x="48" y="116" width="700" height="404" rx="12" fill="#11161d" stroke="rgba(255,255,255,0.10)" stroke-width="1"/><line x1="130.55" y1="330" x2="668.75" y2="330" stroke="#d95926" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-orange)"/><line x1="310.1791081963912" y1="489.74681987298595" x2="522.9840863271617" y2="149.1876654184884" stroke="#199e70" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-aqua)"/><line x1="486.59000000000003" y1="330" x2="425.3570602774783" y2="305.42356617338675" stroke="#f0efec" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4"/><circle cx="176.08999999999997" cy="330" r="6" fill="#d95926" stroke="#11161d" stroke-width="2"/><text x="176.08999999999997" y="358" font-size="13" fill="#c3c2b7" font-weight="400" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace">14:41:00</text><circle cx="331.34000000000003" cy="330" r="6" fill="#d95926" stroke="#11161d" stroke-width="2"/><text x="331.34000000000003" y="358" font-size="13" fill="#c3c2b7" font-weight="400" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace">14:42:15</text><circle cx="486.59000000000003" cy="330" r="6" fill="#d95926" stroke="#11161d" stroke-width="2"/><text x="486.59000000000003" y="358" font-size="13" fill="#c3c2b7" font-weight="400" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace">14:43:30</text><circle cx="343.0870945052732" cy="437.0830331016719" r="6" fill="#199e70" stroke="#11161d" stroke-width="2"/><text x="357.0870945052732" y="441.0830331016719" font-size="13" fill="#c3c2b7" font-weight="400" text-anchor="start" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace">14:41:52</text><circle cx="425.3570602774783" cy="305.42356617338675" r="6" fill="#199e70" stroke="#11161d" stroke-width="2"/><text x="411.3570602774783" y="303.42356617338675" font-size="13" fill="#c3c2b7" font-weight="400" text-anchor="end" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace">14:43:07</text><circle cx="507.6270260496833" cy="173.76409924510162" r="6" fill="#199e70" stroke="#11161d" stroke-width="2"/><text x="521.6270260496833" y="177.76409924510162" font-size="13" fill="#c3c2b7" font-weight="400" text-anchor="start" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace">14:44:22</text><circle cx="410" cy="330" r="11" fill="none" stroke="#f0efec" stroke-width="1.5"/><circle cx="410" cy="330" r="3.5" fill="#f0efec" stroke="none" stroke-width="0"/><line x1="419" y1="339" x2="472" y2="406" stroke="#898781" stroke-width="1" stroke-linecap="round"/><text x="478" y="426" font-size="14.5" fill="#f0efec" font-weight="600" text-anchor="start">Both aircraft are here at 14:42:53</text><text x="478" y="446" font-size="13.5" fill="#c3c2b7" font-weight="400" text-anchor="start">No report exists for that moment</text><line x1="461.9735301387392" y1="313.71178308669334" x2="541.9735301387392" y2="263.71178308669334" stroke="#898781" stroke-width="1" stroke-linecap="round"/><text x="547.9735301387392" y="247.71178308669334" font-size="14.5" fill="#f0efec" font-weight="600" text-anchor="start">Nearest pair of stored reports:</text><text x="547.9735301387392" y="267.71178308669334" font-size="13.5" fill="#c3c2b7" font-weight="400" text-anchor="start">7 km and 23 s apart</text><text x="134.55" y="316" font-size="14" fill="#f0efec" font-weight="600" text-anchor="start">Flight A</text><text x="296.1791081963912" y="495.74681987298595" font-size="14" fill="#f0efec" font-weight="600" text-anchor="end">Flight B</text><text x="788" y="150" font-size="19" fill="#f0efec" font-weight="700" text-anchor="start">What the index can and cannot tell you</text><circle cx="801" cy="195" r="13" fill="#19202a" stroke="rgba(255,255,255,0.10)" stroke-width="1"/><text x="801" y="200" font-size="14" fill="#f0efec" font-weight="700" text-anchor="middle">1</text><text x="828" y="200" font-size="15.5" fill="#f0efec" font-weight="600" text-anchor="start">It only knows the dots</text><text x="828" y="223" font-size="14.5" fill="#c3c2b7" font-weight="400" text-anchor="start">A jet travels about 17 km between</text><text x="828" y="244" font-size="14.5" fill="#c3c2b7" font-weight="400" text-anchor="start">reports. The crossing happens in</text><text x="828" y="265" font-size="14.5" fill="#c3c2b7" font-weight="400" text-anchor="start">the gap.</text><circle cx="801" cy="311" r="13" fill="#19202a" stroke="rgba(255,255,255,0.10)" stroke-width="1"/><text x="801" y="316" font-size="14" fill="#f0efec" font-weight="700" text-anchor="middle">2</text><text x="828" y="316" font-size="15.5" fill="#f0efec" font-weight="600" text-anchor="start">So it finds neighbourhoods</text><text x="828" y="339" font-size="14.5" fill="#c3c2b7" font-weight="400" text-anchor="start">“These two flights had reports</text><text x="828" y="360" font-size="14.5" fill="#c3c2b7" font-weight="400" text-anchor="start">within a few kilometres and a few</text><text x="828" y="381" font-size="14.5" fill="#c3c2b7" font-weight="400" text-anchor="start">seconds of each other.”</text><circle cx="801" cy="427" r="13" fill="#19202a" stroke="rgba(255,255,255,0.10)" stroke-width="1"/><text x="801" y="432" font-size="14" fill="#f0efec" font-weight="700" text-anchor="middle">3</text><text x="828" y="432" font-size="15.5" fill="#f0efec" font-weight="600" text-anchor="start">Geometry does the rest</text><text x="828" y="455" font-size="14.5" fill="#c3c2b7" font-weight="400" text-anchor="start">Join the dots, line up the clocks,</text><text x="828" y="476" font-size="14.5" fill="#c3c2b7" font-weight="400" text-anchor="start">and solve for the exact closest</text><text x="828" y="497" font-size="14.5" fill="#c3c2b7" font-weight="400" text-anchor="start">approach.</text>
</svg>
