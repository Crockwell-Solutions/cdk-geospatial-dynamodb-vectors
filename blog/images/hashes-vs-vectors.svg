<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Geohash cells and time buckets compared with a nearest-neighbour vector search">
<title>Geohash cells and time buckets compared with a nearest-neighbour vector search</title>
<desc>Left: a search circle overlapping nine geohash cells stacked across time buckets, each needing its own query. Right: a single nearest-neighbour search around one point.</desc>
<defs>
