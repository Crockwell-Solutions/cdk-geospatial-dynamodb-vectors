"406" width="46" height="46" fill="#11161d" stroke="rgba(255,255,255,0.10)" stroke-width="1"/><rect x="288" y="406" width="46" height="46" fill="#11161d" stroke="rgba(255,255,255,0.10)" stroke-width="1"/><rect x="88" y="210" width="46" height="46" fill="#19202a" stroke="rgba(255,255,255,0.22)" stroke-width="1"/><rect x="134" y="210" width="46" height="46" fill="#19202a" stroke="rgba(255,255,255,0.22)" stroke-width="1"/><rect x="180" y="210" width="46" height="46" fill="#19202a" stroke="rgba(255,255,255,0.22)" stroke-width="1"/><rect x="226" y="210" width="46" height="46" fill="#19202a" stroke="rgba(255,255,255,0.22)" stroke-width="1"/><rect x="272" y="210" width="46" height="46" fill="#19202a" stroke="rgba(255,255,255,0.22)" stroke-width="1"/><rect x="88" y="256" width="46" height="46" fill="#19202a" stroke="rgba(255,255,255,0.22)" stroke-width="1"/><rect x="134" y="256" width="46" height="46" fill="rgba(57,135,229,0.30)" stroke="rgba(255,255,255,0.22)" stroke-width="1"/><rect x="180" y="256" width="46" height="46" fill="rgba(57,135,229,0.30)" stroke="rgba(255,255,255,0.22)" stroke-width="1"/><rect x="226" y="256" width="46" height="46" fill="rgba(57,135,229,0.30)" stroke="rgba(255,255,255,0.22)" stroke-width="1"/><rect x="272" y="256" width="46" height="46" fill="#19202a" stroke="rgba(255,255,255,0.22)" stroke-width="1"/><rect x="88" y="302" width="46" height="46" fill="#19202a" stroke="rgba(255,255,255,0.22)" stroke-width="1"/><rect x="134" y="302" width="46" height="46" fill="rgba(57,135,229,0.30)" stroke="rgba(255,255,255,0.22)" stroke-width="1"/><rect x="180" y="302" width="46" height="46" fill="rgba(57,135,229,0.30)" stroke="rgba(255,255,255,0.22)" stroke-width="1"/><rect x="226" y="302" width="46" height="46" fill="rgba(57,135,229,0.30)" stroke="rgba(255,255,255,0.22)" stroke-width="1"/><rect x="272" y="302" width="46" height="46" fill="#19202a" stroke="rgba(255,255,255,0.22)" stroke-width="1"/><rect x="88" y="348" width="46" height="46" fill="#19202a" stroke="rgba(255,255,255,0.22)" stroke-width="1"/><rect x="134" y="348" width="46" height="46" fill="rgba(57,135,229,0.30)" stroke="rgba(255,255,255,0.22)" stroke-width="1"/><rect x="180" y="348" width="46" height="46" fill="rgba(57,135,229,0.30)" stroke="rgba(255,255,255,0.22)" stroke-width="1"/><rect x="226" y="348" width="46" height="46" fill="rgba(57,135,229,0.30)" stroke="rgba(255,255,255,0.22)" stroke-width="1"/><rect x="272" y="348" width="46" height="46" fill="#19202a" stroke="rgba(255,255,255,0.22)" stroke-width="1"/><rect x="88" y="394" width="46" height="46" fill="#19202a" stroke="rgba(255,255,255,0.22)" stroke-width="1"/><rect x="134" y="394" width="46" height="46" fill="#19202a" stroke="rgba(255,255,255,0.22)" stroke-width="1"/><rect x="180" y="394" width="46" height="46" fill="#19202a" stroke="rgba(255,255,255,0.22)" stroke-width="1"/><rect x="226" y="394" width="46" height="46" fill="#19202a" stroke="rgba(255,255,255,0.22)" stroke-width="1"/><rect x="272" y="394" width="46" height="46" fill="#19202a" stroke="rgba(255,255,255,0.22)" stroke-width="1"/><circle cx="197.48" cy="321.32" r="54" fill="none" stroke="#d95926" stroke-width="2"/><circle cx="197.48" cy="321.32" r="5" fill="#d95926" stroke="#19202a" stroke-width="2"/><circle cx="143.2" cy="233" r="3.5" fill="#c3c2b7" stroke="none" stroke-width="0"/><circle cx="258.20000000000005" cy="274.4" r="3.5" fill="#c3c2b7" stroke="none" stroke-width="0"/><circle cx="106.4" cy="361.79999999999995" r="3.5" fill="#c3c2b7" stroke="none" stroke-width="0"/><circle cx="221.4" cy="352.6" r="3.5" fill="#c3c2b7" stroke="none" stroke-width="0"/><circle cx="285.79999999999995" cy="403.20000000000005" r="3.5" fill="#c3c2b7" stroke="none" stroke-width="0"/><circle cx="161.60000000000002" cy="334.2" r="3.5" fill="#c3c2b7" stroke="none" stroke-width="0"/><circle cx="239.79999999999998" cy="306.6" r="3.5" fill="#c3c2b7" stroke="none" stroke-width="0"/><circle cx="120.19999999999999" cy="283.6" r="3.5" fill="#c3c2b7" stroke="none" stroke-width="0"/><circle cx="295" cy="237.6" r="3.5" fill="#c3c2b7" stroke="none" stroke-width="0"/><circle cx="189.2" cy="417" r="3.5" fill="#c3c2b7" stroke="none" stroke-width="0"/><text x="366" y="232" font-size="14.5" fill="#c3c2b7" font-weight="400" text-anchor="start">The search area touches</text><text x="366" y="253" font-size="14.5" fill="#c3c2b7" font-weight="400" text-anchor="start">nine cells. Each needs</text><text x="366" y="274" font-size="14.5" fill="#c3c2b7" font-weight="400" text-anchor="start">its own Query, for each</text><text x="366" y="295" font-size="14.5" fill="#c3c2b7" font-weight="400" text-anchor="start">time bucket and each</text><text x="366" y="316" font-size="14.5" fill="#c3c2b7" font-weight="400" text-anchor="start">altitude band.</text><text x="366" y="356" font-size="14.5" fill="#c3c2b7" font-weight="400" text-anchor="start">Then filter: most of</text><text x="366" y="377" font-size="14.5" fill="#c3c2b7" font-weight="400" text-anchor="start">what comes back is</text><text x="366" y="398" font-size="14.5" fill="#c3c2b7" font-weight="400" text-anchor="start">outside the circle.</text><text x="76" y="482" font-size="14.5" fill="#898781" font-weight="400" text-anchor="start">Still the right tool for “everything in this box”</text><rect x="612" y="116" width="540" height="388" rx="12" fill="#11161d" stroke="rgba(255,255,255,0.10)" stroke-width="1"/><text x="640" y="156" font-size="19" fill="#f0efec" font-weight="700" text-anchor="start">Now: nearest neighbours</text><text x="640" y="181" font-size="14.5" fill="#898781" font-weight="400" text-anchor="start">One vector, one request</text><circle cx="782" cy="336" r="64" fill="rgba(57,135,229,0.18)" stroke="#3987e5" stroke-width="1.5"/><circle cx="686" cy="266" r="3.5" fill="#c3c2b7" stroke="none" stroke-width="0"/><circle cx="742" cy="240" r="3.5" fill="#c3c2b7" stroke="none" stroke-width="0"/><circle cx="840" cy="252" r="3.5" fill="#c3c2b7" stroke="none" stroke-width="0"/><circle cx="892" cy="316" r="3.5" fill="#c3c2b7" stroke="none" stroke-width="0"/><circle cx="866" cy="398" r="3.5" fill="#c3c2b7" stroke="none" stroke-width="0"/><circle cx="798" cy="440" r="3.5" fill="#c3c2b7" stroke="none" stroke-width="0"/><circle cx="712" cy="418" r="3.5" fill="#c3c2b7" stroke="none" stroke-width="0"/><circle cx="664" cy="346" r="3.5" fill="#c3c2b7" stroke="none" stroke-width="0"/><circle cx="758" cy="308" r="4.5" fill="#199e70" stroke="#11161d" stroke-width="2"/><line x1="782" y1="336" x2="758" y2="308" stroke="#c3c2b7" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 3"/><circle cx="812" cy="354" r="4.5" fill="#199e70" stroke="#11161d" stroke-width="2"/><line x1="782" y1="336" x2="812" y2="354" stroke="#c3c2b7" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 3"/><circle cx="736" cy="370" r="4.5" fill="#199e70" stroke="#11161d" stroke-width="2"/><line x1="782" y1="336" x2="736" y2="370" stroke="#c3c2b7" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 3"/><circle cx="834" cy="306" r="4.5" fill="#199e70" stroke="#11161d" stroke-width="2"/><line x1="782" y1="336" x2="834" y2="306" stroke="#c3c2b7" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 3"/><circle cx="912" cy="432" r="3.5" fill="#c3c2b7" stroke="none" stroke-width="0"/><circle cx="642" cy="232" r="3.5" fill="#c3c2b7" stroke="none" stroke-width="0"/><circle cx="782" cy="336" r="6" fill="#d95926" stroke="#11161d" stroke-width="2"/><text x="958" y="232" font-size="14.5" fill="#c3c2b7" font-weight="400" text-anchor="start">Ask for the K nearest</text><text x="958" y="253" font-size="14.5" fill="#c3c2b7" font-weight="400" text-anchor="start">points to [x, y, z, t].</text><text x="958" y="298" font-size="14.5" fill="#c3c2b7" font-weight="400" text-anchor="start">No cells, so no cell</text><text x="958" y="319" font-size="14.5" fill="#c3c2b7" font-weight="400" text-anchor="start">edges for a neighbour</text><text x="958" y="340" font-size="14.5" fill="#c3c2b7" font-weight="400" text-anchor="start">to hide behind.</text><text x="958" y="386" font-size="14.5" fill="#c3c2b7" font-weight="400" text-anchor="start">Time is just another</text><text x="958" y="407" font-size="14.5" fill="#c3c2b7" font-weight="400" text-anchor="start">axis, not a bucket.</text><text x="640" y="482" font-size="14.5" fill="#898781" font-weight="400" text-anchor="start">The right tool for “what was closest to this?”</text>
</svg>
