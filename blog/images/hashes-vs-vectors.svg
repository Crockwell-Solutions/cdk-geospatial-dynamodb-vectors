  <marker id="arrow-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5" fill="none" stroke="#f0efec" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5" fill="none" stroke="#3987e5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arrow-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5" fill="none" stroke="#d95926" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arrow-aqua" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5" fill="none" stroke="#199e70" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="1200" height="540" rx="16" fill="#0b0f14"/>
<text x="48" y="58" font-size="26" fill="#f0efec" font-weight="700" text-anchor="start">Two ways to ask “what was near here, then?”</text><text x="48" y="88" font-size="16" fill="#c3c2b7" font-weight="400" text-anchor="start">Hashes turn nearness into equality on a key. A vector index answers the question as asked.</text><rect x="48" y="116" width="540" height="388" rx="12" fill="#11161d" stroke="rgba(255,255,255,0.10)" stroke-width="1"/><text x="76" y="156" font-size="19" fill="#f0efec" font-weight="700" text-anchor="start">Before: hashes and buckets</text><text x="76" y="181" font-size="14.5" fill="#898781" font-weight="400" text-anchor="start">Geohash cell × altitude band × time bucket</text><rect x="120" y="234" width="46" height="46" fill="#11161d" stroke="rgba(255,255,255,0.10)" stroke-width="1"/><rect x="166" y="234" width="46" height="46" fill="#11161d" stroke="rgba(255,255,255,0.10)" stroke-width="1"/><rect x="212" y="234" width="46" height="46" fill="#11161d" stroke="rgba(255,255,255,0.10)" stroke-width="1"/><rect x="258" y="234" width="46" height="46" fill="#11161d" stroke="rgba(255,255,255,0.10)" stroke-width="1"/><rect x="304" y="234" width="46" height="46" fill="#11161d" stroke="rgba(255,255,255,0.10)" stroke-width="1"/><rect x="120" y="280" width="46" height="46" fill="#11161d" stroke="rgba(255,255,255,0.10)" stroke-width="1"/><rect x="166" y="280" width="46" height="46" fill="#11161d" stroke="rgba(255,255,255,0.10)" stroke-width="1"/><rect x="212" y="280" width="46" height="46" fill="#11161d" stroke="rgba(255,255,255,0.10)" stroke-width="1"/><rect x="258" y="280" width="46" height="46" fill="#11161d" stroke="rgba(255,255,255,0.10)" stroke-width="1"/><rect x="304" y="280" width="46" height="46" fill="#11161d" stroke="rgba(255,255,255,0.10)" stroke-width="1"/><rect x="120" y="326" width="46" height="46" fill="#11161d" stroke="rgba(255,255,255,0.10)" stroke-width="1"/><rect x="166" y="326" width="46" height="46" fill="#11161d" stroke="rgba(255,255,255,0