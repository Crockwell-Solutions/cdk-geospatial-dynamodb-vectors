<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="An embedding and a position report are both just lists of numbers to a vector index">
<title>An embedding and a position report are both just lists of numbers to a vector index</title>
<desc>Left: a product description becomes a 1,024-dimension embedding through a model. Right: a position report becomes a four-dimension vector through projection and scaling.</desc>
<defs>
  <marker id="arrow-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5" fill="none" stroke="#898781" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arrow-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5" fill="none" stroke="#f0efec" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5" fill="none" stroke="#3987e5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arrow-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5" fill="none" stroke="#d95926" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arrow-aqua" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5" fill="none" stroke="#199e70" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="1200" height="520" rx="16" fill="#0b0f14"/>
<text x="48" y="58" font-size="26" fill="#f0efec" font-weight="700" text-anchor="start">A vector index does not care where the numbers came from</text><text x="48" y="88" font-size="16" fill="#c3c2b7" font-weight="400" text-anchor="start">It finds the stored lists of numbers nearest to the one you give it. What they mean is up to you.</text><rect x="48" y="120" width="540" height="360" rx="12" fill="#11161d" stroke="rgba(255,255,255,0.10)" stroke-width="1"/><text x="76" y="162" font-size="19" fill="#f0efec" font-weight="700" text-anchor="start">The usual way: an embedding</text><text x="76" y="188" font-size="14.5" fill="#898781" font-weight="400" text-anchor="start">A model turns content into numbers</text><rect x="76" y="214" width="484" height="54" rx="8" fill="#19202a" stroke="rgba(255,255,255,0.10)" stroke-width="1"/><text x="96" y="247" font-size="16" fill="#c3c2b7" font-weight="400" text-anchor="start" font-style="italic">“Lightweight waterproof hiking jacket”</text><line x1="318" y1="276" x2="318" y2="304" stroke="#898781" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow-muted)"/><rect x="238" y="310" width="160" height="38" rx="19" fill="none" stroke="#898781" stroke-width="1"/><text x="318" y="334" font-size="14" fill="#c3c2b7" font-weight="400" text-anchor="middle">embedding model</text><line x1="318" y1="354" x2="318" y2="382" stroke="#898781" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow-muted)"/><rect x="76" y="388" width="484" height="44" rx="8" fill="#19202a" stroke="rgba(255,255,255,0.10)" stroke-width="1"/><text x="96" y="416" font-size="16" fill="#f0efec" font-weight="400" text-anchor="start" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace">[ 0.12, -0.85, 0.44, 0.67, 0.03, …  ]</text><text x="76" y="458" font-size="14.5" fill="#898781" font-weight="400" text-anchor="start">1,024 dimensions · meaning is learned · near = similar</text><rect x="612" y="120" width="540" height="360" rx="12" fill="#11161d" stroke="rgba(255,255,255,0.10)" stroke-width="1"/><text x="640" y="162" font-size="19" fill="#f0efec" font-weight="700" text-anchor="start">This post: a position report</text><text x="640" y="188" font-size="14.5" fill="#898781" font-weight="400" text-anchor="start">Arithmetic turns a measurement into numbers</text><rect x="640" y="214" width="484" height="54" rx="8" fill="#19202a" stroke="rgba(255,255,255,0.10)" stroke-width="1"/><text x="660" y="247" font-size="16" fill="#c3c2b7" font-weight="400" text-anchor="start" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace">48.8566°N  2.3522°E  35,000 ft  14:41:00 UTC</text><line x1="882" y1="276" x2="882" y2="304" stroke="#898781" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow-muted)"/><rect x="772" y="310" width="220" height="38" rx="19" fill="none" stroke="#898781" stroke-width="1"/><text x="882" y="334" font-size="14" fill="#c3c2b7" font-weight="400" text-anchor="middle">project, then scale</text><line x1="882" y1="354" x2="882" y2="382" stroke="#898781" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow-muted)"/><rect x="640" y="388" width="484" height="44" rx="8" fill="#19202a" stroke="rgba(255,255,255,0.10)" stroke-width="1"/><text x="660" y="416" font-size="16" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" fill="#f0efec">[ -47.5, 262.0, 324.1, <tspan fill="#d95926">13,215.0</tspan> ]</text><text x="640" y="458" font-size="14.5" fill="#898781" font-weight="400" text-anchor="start">4 dimensions · meaning is designed · near = kilometres</text>
</svg>
