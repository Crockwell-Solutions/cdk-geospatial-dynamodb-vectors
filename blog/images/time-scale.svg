<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Effect of the time scale on shortlist size and recall">
<title>Effect of the time scale on shortlist size and recall</title>
<desc>At 0.05 km per second the search checks 22 candidate flights per analysis with full recall; at 0.25 it checks 8.4 with full recall; at 1 km per second it checks 6.3 but recall falls to 99.3 percent.</desc>
<defs>
  <marker id="arrow-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5" fill="none" stroke="#898781" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arrow-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5" fill="none" stroke="#f0efec" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5" fill="none" stroke="#3987e5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arrow-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5" fill="none" stroke="#d95926" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arrow-aqua" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5" fill="none" stroke="#199e70" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="1200" height="430" rx="16" fill="#0b0f14"/>
<text x="48" y="58" font-size="26" fill="#f0efec" font-weight="700" text-anchor="start">Choosing the exchange rate for time</text><text x="48" y="88" font-size="16" fill="#c3c2b7" font-weight="400" text-anchor="start">Candidate flights that had to be checked per analysis, and recall, at 5 NM and 1,000 ft. TopK 100.</text><text x="330" y="132" font-size="13.5" fill="#898781" font-weight="400" text-anchor="start">Candidate flights per analysis</text><text x="700" y="132" font-size="13.5" fill="#898781" font-weight="400" text-anchor="start">Recall</text><text x="790" y="132" font-size="13.5" fill="#898781" font-weight="400" text-anchor="start">What happens</text><text x="48" y="172" font-size="17" fill="#f0efec" font-weight="700" text-anchor="start" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace">0.05 km/s</text><text x="48" y="194" font-size="13" fill="#898781" font-weight="400" text-anchor="start">Time barely counts</text><path d="M330 156 h304 a4 4 0 0 1 4 4 v16 a4 4 0 0 1 -4 4 h-304 z" fill="#1c5cab"/><text x="648" y="175" font-size="15" fill="#f0efec" font-weight="600" text-anchor="start">22.0</text><text x="700" y="175" font-size="17" fill="#f0efec" font-weight="600" text-anchor="start">100%</text><text x="790" y="166" font-size="14" fill="#c3c2b7" font-weight="400" text-anchor="start">Finds everything, but lets in flights that</text><text x="790" y="186" font-size="14" fill="#c3c2b7" font-weight="400" text-anchor="start">passed minutes apart: 2.6 times the work</text><rect x="36" y="224" width="1128" height="72" rx="10" fill="#11161d" stroke="rgba(255,255,255,0.10)" stroke-width="1"/><text x="48" y="254" font-size="17" fill="#f0efec" font-weight="700" text-anchor="start" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace">0.25 km/s</text><text x="48" y="276" font-size="13" fill="#898781" font-weight="400" text-anchor="start">About jet speed · used in the demo</text><path d="M330 238 h113.60000000000001 a4 4 0 0 1 4 4 v16 a4 4 0 0 1 -4 4 h-113.60000000000001 z" fill="#3987e5"/><text x="457.6" y="257" font-size="15" fill="#f0efec" font-weight="600" text-anchor="start">8.4</text><text x="700" y="257" font-size="17" fill="#f0efec" font-weight="600" text-anchor="start">100%</text><text x="790" y="248" font-size="14" fill="#c3c2b7" font-weight="400" text-anchor="start">Finds everything with the smallest shortlist</text><text x="790" y="268" font-size="14" fill="#c3c2b7" font-weight="400" text-anchor="start">that does</text><text x="48" y="336" font-size="17" fill="#f0efec" font-weight="700" text-anchor="start" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace">1 km/s</text><text x="48" y="358" font-size="13" fill="#898781" font-weight="400" text-anchor="start">Time dominates</text><path d="M330 320 h84.2 a4 4 0 0 1 4 4 v16 a4 4 0 0 1 -4 4 h-84.2 z" fill="#1c5cab"/><text x="428.2" y="339" font-size="15" fill="#f0efec" font-weight="600" text-anchor="start">6.3</text><text x="700" y="339" font-size="17" fill="#f0efec" font-weight="600" text-anchor="start">99.3%</text><text x="790" y="330" font-size="14" fill="#c3c2b7" font-weight="400" text-anchor="start">A slightly shorter shortlist, but it starts to</text><text x="790" y="350" font-size="14" fill="#c3c2b7" font-weight="400" text-anchor="start">miss real encounters</text><line x1="330" y1="146" x2="330" y2="374" stroke="#383835" stroke-width="1" stroke-linecap="round"/><text x="48" y="408" font-size="13" fill="#898781" font-weight="400" text-anchor="start">Same evaluation as above: 1,000 sampled flights, 1,002 true encounters, 5% of neighbours dropped.</text>
</svg>
