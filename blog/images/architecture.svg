<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Architecture of the flight proximity demo">
<title>Architecture of the flight proximity demo</title>
<desc>A browser talks to CloudFront, which serves the React app from S3 and routes /api to API Gateway and five Lambda functions. The functions read a single DynamoDB table through its base table, a global secondary index and a four-dimensional vector index.</desc>
<defs>
  <marker id="arrow-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5" fill="none" stroke="#898781" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arrow-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5" fill="none" stroke="#f0efec" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5" fill="none" stroke="#3987e5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arrow-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5" fill="none" stroke="#d95926" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arrow-aqua" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5" fill="none" stroke="#199e70" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="1200" height="640" rx="16" fill="#0b0f14"/>
<text x="48" y="58" font-size="26" fill="#f0efec" font-weight="700" text-anchor="start">Architecture</text><text x="48" y="88" font-size="16" fill="#c3c2b7" font-weight="400" text-anchor="start">Three CDK stacks. Everything is serverless and on-demand, so an idle deployment costs next to nothing.</text><rect x="48" y="300" width="170" height="104" rx="10" fill="#19202a" stroke="rgba(255,255,255,0.10)" stroke-width="1"/><text x="64" y="328" font-size="15.5" fill="#f0efec" font-weight="600" text-anchor="start">Browser</text><text x="64" y="350" font-size="13" fill="#c3c2b7" font-weight="400" text-anchor="start">React + MapLibre</text><text x="64" y="368.5" font-size="13" fill="#c3c2b7" font-weight="400" text-anchor="start">Flights cached in</text><text x="64" y="387" font-size="13" fill="#c3c2b7" font-weight="400" text-anchor="start">IndexedDB</text><rect x="250" y="120" width="250" height="484" rx="14" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="1" stroke-dasharray="5 5"/><text x="266" y="146" font-size="12.5" fill="#898781" font-weight="700" text-anchor="start" letter-spacing="1.2">FRONTEND STACK</text><rect x="270" y="300" width="210" height="104" rx="10" fill="#19202a" stroke="rgba(255,255,255,0.10)" stroke-width="1"/><text x="286" y="328" font-size="15.5" fill="#f0efec" font-weight="600" text-anchor="start">CloudFront</text><text x="286" y="350" font-size="13" fill="#c3c2b7" font-weight="400" text-anchor="start">One origin for the app</text><text x="286" y="368.5" font-size="13" fill="#c3c2b7" font-weight="400" text-anchor="start">and the API, so no</text><text x="286" y="387" font-size="13" fill="#c3c2b7" font-weight="400" text-anchor="start">CORS and no config</text><rect x="270" y="162" width="210" height="84" rx="10" fill="#19202a" stroke="rgba(255,255,255,0.10)" stroke-width="1"/><text x="286" y="190" font-size="15.5" fill="#f0efec" font-weight="600" text-anchor="start">S3</text><text x="286" y="212" font-size="13" fill="#c3c2b7" font-weight="400" text-anchor="start">The built React app</text><line x1="218" y1="352" x2="264" y2="352" stroke="#898781" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow-muted)"/><line x1="375" y1="300" x2="375" y2="252" stroke="#898781" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow-muted)"/><text x="365" y="280" font-size="12.5" fill="#898781" font-weight="400" text-anchor="end">everything else</text><rect x="532" y="120" width="300" height="484" rx="14" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="1" stroke-dasharray="5 5"/><text x="548" y="146" font-size="12.5" fill="#898781" font-weight="700" text-anchor="start" letter-spacing="1.2">STATELESS STACK</text><rect x="552" y="162" width="260" height="76" rx="10" fill="#19202a" stroke="rgba(255,255,255,0.10)" stroke-width="1"/><text x="568" y="190" font-size="15.5" fill="#f0efec" font-weight="600" text-anchor="start">API Gateway</text><text x="568" y="212" font-size="13" fill="#c3c2b7" font-weight="400" text-anchor="start">REST, throttled, no auth</text><line x1="480" y1="340" x2="520" y2="340" stroke="#898781" stroke-width="1.5" stroke-linecap="round"/><path d="M 520 340 L 520 200 L 546 200" stroke="#898781" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-muted)"/><text x="508" y="268" font-size="12.5" fill="#898781" font-weight="400" text-anchor="end">/api/*</text><text x="552" y="276" font-size="13" fill="#898781" font-weight="400" text-anchor="start">One Lambda per route</text><rect x="552" y="290" width="260" height="46" rx="8" fill="#19202a" stroke="rgba(255,255,255,0.10)" stroke-width="1"/><text x="568" y="318" font-size="13" fill="#f0efec" font-weight="400" text-anchor="start" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace">GET /api/flights/{id}</text><rect x="552" y="350" width="260" height="46" rx="8" fill="#19202a" stroke="rgba(255,255,255,0.10)" stroke-width="1"/><text x="568" y="378" font-size="13" fill="#f0efec" font-weight="400" text-anchor="start" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace">GET /api/flights?bucket=</text><rect x="552" y="410" width="260" height="46" rx="8" fill="#19202a" stroke="#199e70" stroke-width="1.5"/><text x="568" y="438" font-size="13" fill="#f0efec" font-weight="400" text-anchor="start" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace">GET /api/flights/{id}/nearby</text><rect x="552" y="470" width="260" height="46" rx="8" fill="#19202a" stroke="rgba(255,255,255,0.10)" stroke-width="1"/><text x="568" y="498" font-size="13" fill="#f0efec" font-weight="400" text-anchor="start" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace">GET /api/manifest</text><rect x="552" y="530" width="260" height="46" rx="8" fill="#19202a" stroke="rgba(255,255,255,0.10)" stroke-width="1"/><text x="568" y="558" font-size="13" fill="#f0efec" font-weight="400" text-anchor="start" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace">GET /api/health</text><line x1="682" y1="238" x2="682" y2="258" stroke="#898781" stroke-width="1.5" stroke-linecap="round"/><rect x="864" y="120" width="288" height="484" rx="14" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="1" stroke-dasharray="5 5"/><text x="880" y="146" font-size="12.5" fill="#898781" font-weight="700" text-anchor="start" letter-spacing="1.2">STATEFUL STACK</text><rect x="884" y="162" width="248" height="330" rx="10" fill="#19202a" stroke="rgba(255,255,255,0.10)" stroke-width="1"/><text x="900" y="190" font-size="15.5" fill="#f0efec" font-weight="600" text-anchor="start">DynamoDB table</text><text x="900" y="210" font-size="13" fill="#c3c2b7" font-weight="400" text-anchor="start">FlightVectors · on-demand</text><rect x="900" y="228" width="216" height="74" rx="8" fill="#11161d" stroke="rgba(255,255,255,0.10)" stroke-width="1"/><text x="914" y="254" font-size="14" fill="#f0efec" font-weight="600" text-anchor="start">Base table</text><text x="914" y="274" font-size="12.5" fill="#c3c2b7" font-weight="400" text-anchor="start">Query: one flight and its reports</text><rect x="900" y="312" width="216" height="74" rx="8" fill="#11161d" stroke="rgba(255,255,255,0.10)" stroke-width="1"/><text x="914" y="338" font-size="14" fill="#f0efec" font-weight="600" text-anchor="start">GSI1</text><text x="914" y="358" font-size="12.5" fill="#c3c2b7" font-weight="400" text-anchor="start">Query: flights starting in an hour</text><rect x="900" y="396" width="216" height="74" rx="8" fill="#11161d" stroke="#199e70" stroke-width="1.5"/><text x="914" y="422" font-size="14" fill="#f0efec" font-weight="600" text-anchor="start">Vector index</text><text x="914" y="442" font-size="12.5" fill="#c3c2b7" font-weight="400" text-anchor="start">SearchVectors: 4 dimensions,</text><text x="914" y="459" font-size="12.5" fill="#c3c2b7" font-weight="400" text-anchor="start">Euclidean, hundreds in parallel</text><line x1="812" y1="313" x2="892" y2="267" stroke="#898781" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow-muted)" opacity="0.8"/><line x1="812" y1="373" x2="892" y2="351" stroke="#898781" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow-muted)" opacity="0.8"/><line x1="812" y1="433" x2="892" y2="433" stroke="#199e70" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-aqua)"/><rect x="884" y="512" width="248" height="76" rx="10" fill="#19202a" stroke="rgba(255,255,255,0.22)" stroke-width="1"/><text x="900" y="540" font-size="15.5" fill="#f0efec" font-weight="600" text-anchor="start">npm run load-data</text><text x="900" y="562" font-size="13" fill="#c3c2b7" font-weight="400" text-anchor="start">BatchWriteItem from your machine</text><line x1="1008" y1="512" x2="1008" y2="496" stroke="#898781" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow-muted)"/>
</svg>
