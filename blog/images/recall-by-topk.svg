<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Recall of true encounters by TopK and proximity limits">
<title>Recall of true encounters by TopK and proximity limits</title>
<desc>At TopK 100 every true encounter is found for all five limit settings. At TopK 10, recall for the widest setting of 20 NM and 5,000 ft falls to 82.1 percent.</desc>
