<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Single-table design with a sparse GSI and a sparse vector index">
<title>Single-table design with a sparse GSI and a sparse vector index</title>
<desc>Flight summaries carry GSI1 keys and appear in GSI1. Position reports carry a vec attribute and appear in the vector index. A single manifest item describes the dataset.</desc>
<defs>
  <marker id="arrow-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5" fill="none" stroke="#898781" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arrow-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5" fill="none" stroke="#f0efec" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5" fill="none" stroke="#3987e5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arrow-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5" fill="none" stroke="#d95926" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arrow-aqua" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5" fill="none" stroke="#199e70" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="1200" height="520" rx="16" fill="#0b0f14"/>
<text x="48" y="58" font-size="26" fill="#f0efec" font-weight="700" text-anchor="start">One table, three ways in</text><text x="48" y="88" font-size="16" fill="#c3c2b7" font-weight="400" text-anchor="start">Both indexes are sparse: an item only appears in an index if it carries that index’s attributes.</text><rect x="48" y="116" width="1104" height="364" rx="12" fill="#11161d" stroke="rgba(255,255,255,0.10)" stroke-width="1"/><text x="68" y="150" font-size="12.5" fill="#898781" font-weight="700" text-anchor="start" letter-spacing="1.2">PK</text><text x="350" y="150" font-size="12.5" fill="#898781" font-weight="700" text-anchor="start" letter-spacing="1.2">SK</text><text x="626" y="150" font-size="12.5" fill="#898781" font-weight="700" text-anchor="start" letter-spacing="1.2">Attributes</text><text x="970" y="150" font-size="12.5" fill="#898781" font-weight="700" text-anchor="start" letter-spacing="1.2">Appears in</text><line x1="48" y1="166" x2="1152" y2="166" stroke="#2c2c2a" stroke-width="1" stroke-linecap="butt"/><text x="68" y="194" font-size="12.5" fill="#898781" font-weight="400" text-anchor="start">Flight summary, one per flight</text><text x="68" y="218" font-size="13.5" fill="#f0efec" font-weight="400" text-anchor="start" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace">FLIGHT#EWG9GB#2026-10-01</text><text x="350" y="218" font-size="13.5" fill="#f0efec" font-weight="400" text-anchor="start" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace">META</text><text x="626" y="196" font-size="13" fill="#c3c2b7" font-weight="400" text-anchor="start" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace">callsign, aircraftType, startTime…</text><text x="626" y="216" font-size="13" fill="#c3c2b7" font-weight="400" text-anchor="start" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace">track: [encoded polyline]</text><text x="626" y="236" font-size="13" fill="#c3c2b7" font-weight="400" text-anchor="start" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace">GSI1PK: DAY#2026-10-01#14</text><rect x="970" y="185" width="108" height="24" rx="12" fill="none" stroke="#898781" stroke-width="1.2"/><circle cx="983" cy="197" r="4" fill="#898781" stroke="none" stroke-width="0"/><text x="994" y="202" font-size="12.5" fill="#f0efec" font-weight="400" text-anchor="start">Base table</text><rect x="970" y="215" width="63.6" height="24" rx="12" fill="none" stroke="#3987e5" stroke-width="1.2"/><circle cx="983" cy="227" r="4" fill="#3987e5" stroke="none" stroke-width="0"/><text x="994" y="232" font-size="12.5" fill="#f0efec" font-weight="400" text-anchor="start">GSI1</text><line x1="48" y1="270" x2="1152" y2="270" stroke="#2c2c2a" stroke-width="1" stroke-linecap="butt"/><text x="68" y="298" font-size="12.5" fill="#898781" font-weight="400" text-anchor="start">Position report, about 30 per flight</text><text x="68" y="322" font-size="13.5" fill="#f0efec" font-weight="400" text-anchor="start" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace">FLIGHT#EWG9GB#2026-10-01</text><text x="350" y="322" font-size="13.5" fill="#f0efec" font-weight="400" text-anchor="start" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace">POS#2026-10-01T14:43:07.300Z</text><text x="626" y="300" font-size="13" fill="#c3c2b7" font-weight="400" text-anchor="start" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace">lon, lat, alt, ts, seg</text><text x="626" y="320" font-size="13" fill="#c3c2b7" font-weight="400" text-anchor="start" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace">vec: [-151.9, -401.5, 334.0, 13246.8]</text><rect x="970" y="289" width="108" height="24" rx="12" fill="none" stroke="#898781" stroke-width="1.2"/><circle cx="983" cy="301" r="4" fill="#898781" stroke="none" stroke-width="0"/><text x="994" y="306" font-size="12.5" fill="#f0efec" font-weight="400" text-anchor="start">Base table</text><rect x="970" y="319" width="122.80000000000001" height="24" rx="12" fill="none" stroke="#199e70" stroke-width="1.2"/><circle cx="983" cy="331" r="4" fill="#199e70" stroke="none" stroke-width="0"/><text x="994" y="336" font-size="12.5" fill="#f0efec" font-weight="400" text-anchor="start">Vector index</text><line x1="48" y1="374" x2="1152" y2="374" stroke="#2c2c2a" stroke-width="1" stroke-linecap="butt"/><text x="68" y="402" font-size="12.5" fill="#898781" font-weight="400" text-anchor="start">Dataset manifest, one item</text><text x="68" y="426" font-size="13.5" fill="#f0efec" font-weight="400" text-anchor="start" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace">DATASET</text><text x="350" y="426" font-size="13.5" fill="#f0efec" font-weight="400" text-anchor="start" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace">MANIFEST</text><text x="626" y="404" font-size="13" fill="#c3c2b7" font-weight="400" text-anchor="start" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace">flight counts by hour, version,</text><text x="626" y="424" font-size="13" fill="#c3c2b7" font-weight="400" text-anchor="start" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace">vector scales and time origin</text><rect x="970" y="393" width="108" height="24" rx="12" fill="none" stroke="#898781" stroke-width="1.2"/><circle cx="983" cy="405" r="4" fill="#898781" stroke="none" stroke-width="0"/><text x="994" y="410" font-size="12.5" fill="#f0efec" font-weight="400" text-anchor="start">Base table</text><text x="48" y="506" font-size="13.5" fill="#898781" font-weight="400" text-anchor="start">14,444 summaries + 431,356 position reports + 1 manifest = 445,801 items</text>
</svg>
