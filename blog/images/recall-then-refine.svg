<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="The two-stage search: vector recall followed by exact refinement">
<title>The two-stage search: vector recall followed by exact refinement</title>
<desc>For flight EWG9GB, 162 parallel vector searches return 16,200 neighbours, which reduce to 28 candidate flights, of which 5 are confirmed by exact closest-approach geometry.</desc>
<defs>
  <marker id="arrow-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5" fill="none" stroke="#898781" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arrow-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5" fill="none" stroke="#f0efec" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5" fill="none" stroke="#3987e5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arrow-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5" fill="none" stroke="#d95926" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arrow-aqua" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5" fill="none" stroke="#199e70" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="1200" height="600" rx="16" fill="#0b0f14"/>
<text x="48" y="58" font-size="26" fill="#f0efec" font-weight="700" text-anchor="start">Recall, then refine</text><text x="48" y="88" font-size="16" fill="#c3c2b7" font-weight="400" text-anchor="start">What happens when you press Analyse on flight EWG9GB (5 NM, 1,000 ft). Real numbers from the sample data.</text><rect x="48" y="116" width="652" height="300" rx="12" fill="#11161d" stroke="rgba(255,255,255,0.10)" stroke-width="1"/><rect x="716" y="116" width="436" height="300" rx="12" fill="#11161d" stroke="rgba(255,255,255,0.10)" stroke-width="1"/><text x="72" y="150" font-size="12.5" fill="#9ec5f4" font-weight="700" text-anchor="start" letter-spacing="1.5">STAGE 1 · RECALL</text><text x="72" y="172" font-size="15" fill="#c3c2b7" font-weight="400" text-anchor="start">The vector index narrows 14,444 flights to a shortlist</text><text x="740" y="150" font-size="12.5" fill="#9ec5f4" font-weight="700" text-anchor="start" letter-spacing="1.5">STAGE 2 · REFINE</text><text x="740" y="172" font-size="15" fill="#c3c2b7" font-weight="400" text-anchor="start">Exact geometry confirms each one</text><rect x="72" y="196" width="184" height="196" rx="10" fill="#19202a" stroke="rgba(255,255,255,0.10)" stroke-width="1"/><text x="90" y="246" font-size="34" fill="#f0efec" font-weight="700" text-anchor="start">162</text><text x="90" y="274" font-size="15" fill="#f0efec" font-weight="600" text-anchor="start">probe points</text><text x="90" y="300" font-size="13.5" fill="#c3c2b7" font-weight="400" text-anchor="start">Its 52 position reports,</text><text x="90" y="319.5" font-size="13.5" fill="#c3c2b7" font-weight="400" text-anchor="start">plus interpolated points</text><text x="90" y="339" font-size="13.5" fill="#c3c2b7" font-weight="400" text-anchor="start">so there is one at least</text><text x="90" y="358.5" font-size="13.5" fill="#c3c2b7" font-weight="400" text-anchor="start">every 30 seconds</text><line x1="262" y1="294" x2="280" y2="294" stroke="#898781" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow-muted)"/><rect x="288" y="196" width="194" height="196" rx="10" fill="#19202a" stroke="rgba(255,255,255,0.10)" stroke-width="1"/><text x="306" y="246" font-size="34" fill="#f0efec" font-weight="700" text-anchor="start">162</text><text x="306" y="274" font-size="15" fill="#f0efec" font-weight="600" text-anchor="start">vector searches</text><text x="306" y="300" font-size="13.5" fill="#c3c2b7" font-weight="400" text-anchor="start">One SearchVectors call</text><text x="306" y="319.5" font-size="13.5" fill="#c3c2b7" font-weight="400" text-anchor="start">per probe, all in parallel.</text><text x="306" y="339" font-size="13.5" fill="#c3c2b7" font-weight="400" text-anchor="start">Each asks for the 100</text><text x="306" y="358.5" font-size="13.5" fill="#c3c2b7" font-weight="400" text-anchor="start">nearest reports in 4D</text><line x1="488" y1="294" x2="506" y2="294" stroke="#898781" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow-muted)"/><rect x="514" y="196" width="162" height="196" rx="10" fill="#19202a" stroke="rgba(255,255,255,0.10)" stroke-width="1"/><text x="532" y="246" font-size="34" fill="#f0efec" font-weight="700" text-anchor="start">28</text><text x="532" y="274" font-size="15" fill="#f0efec" font-weight="600" text-anchor="start">candidates</text><text x="532" y="300" font-size="13.5" fill="#c3c2b7" font-weight="400" text-anchor="start">Other flights with a</text><text x="532" y="319.5" font-size="13.5" fill="#c3c2b7" font-weight="400" text-anchor="start">report within 28 km</text><text x="532" y="339" font-size="13.5" fill="#c3c2b7" font-weight="400" text-anchor="start">of a probe, out of</text><text x="532" y="358.5" font-size="13.5" fill="#c3c2b7" font-weight="400" text-anchor="start">16,200 neighbours</text><line x1="682" y1="294" x2="730" y2="294" stroke="#898781" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow-muted)"/><rect x="740" y="196" width="196" height="196" rx="10" fill="#19202a" stroke="rgba(255,255,255,0.10)" stroke-width="1"/><text x="758" y="246" font-size="34" fill="#f0efec" font-weight="700" text-anchor="start">28</text><text x="758" y="274" font-size="15" fill="#f0efec" font-weight="600" text-anchor="start">track queries</text><text x="758" y="300" font-size="13.5" fill="#c3c2b7" font-weight="400" text-anchor="start">One Query per candidate</text><text x="758" y="319.5" font-size="13.5" fill="#c3c2b7" font-weight="400" text-anchor="start">loads its position reports,</text><text x="758" y="339" font-size="13.5" fill="#c3c2b7" font-weight="400" text-anchor="start">then the exact closest</text><text x="758" y="358.5" font-size="13.5" fill="#c3c2b7" font-weight="400" text-anchor="start">approach is computed</text><line x1="942" y1="294" x2="960" y2="294" stroke="#898781" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow-muted)"/><rect x="968" y="196" width="160" height="196" rx="10" fill="#19202a" stroke="#199e70" stroke-width="1.5"/><text x="986" y="246" font-size="34" fill="#f0efec" font-weight="700" text-anchor="start">5</text><text x="986" y="274" font-size="15" fill="#f0efec" font-weight="600" text-anchor="start">encounters</text><text x="986" y="300" font-size="13.5" fill="#c3c2b7" font-weight="400" text-anchor="start">Flights that really</text><text x="986" y="319.5" font-size="13.5" fill="#c3c2b7" font-weight="400" text-anchor="start">came within 5 NM</text><text x="986" y="339" font-size="13.5" fill="#c3c2b7" font-weight="400" text-anchor="start">and 1,000 ft, at</text><text x="986" y="358.5" font-size="13.5" fill="#c3c2b7" font-weight="400" text-anchor="start">the same instant</text><text x="48" y="462" font-size="15" fill="#f0efec" font-weight="600" text-anchor="start">How much is left to look at</text><text x="274" y="501" font-size="14" fill="#c3c2b7" font-weight="400" text-anchor="end">Flights in the table</text><path d="M290 486 h756 a4 4 0 0 1 4 4 v12 a4 4 0 0 1 -4 4 h-756 z" fill="#3987e5"/><text x="1060" y="501" font-size="14.5" fill="#f0efec" font-weight="600" text-anchor="start">14,444</text><text x="274" y="533" font-size="14" fill="#c3c2b7" font-weight="400" text-anchor="end">After the vector searches</text><path d="M290 518 h260.40450374529615 a4 4 0 0 1 4 4 v12 a4 4 0 0 1 -4 4 h-260.40450374529615 z" fill="#3987e5"/><text x="564.4045037452961" y="533" font-size="14.5" fill="#f0efec" font-weight="600" text-anchor="start">28</text><text x="274" y="565" font-size="14" fill="#c3c2b7" font-weight="400" text-anchor="end">After exact refinement</text><path d="M290 550 h123.70603702340861 a4 4 0 0 1 4 4 v12 a4 4 0 0 1 -4 4 h-123.70603702340861 z" fill="#199e70"/><text x="427.7060370234086" y="565" font-size="14.5" fill="#f0efec" font-weight="600" text-anchor="start">5</text><text x="1152" y="582" font-size="12" fill="#898781" font-weight="400" text-anchor="end">Bar lengths on a logarithmic scale</text>
</svg>
