<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Scaling altitude so that 1,000 ft equals 5 NM">
<title>Scaling altitude so that 1,000 ft equals 5 NM</title>
<desc>In true scale an aircraft 1,000 ft above looks eighteen times nearer than one 3 NM away at the same level. After multiplying altitude by 9.26 km per 1,000 ft the order reverses and the protected zone becomes a sphere.</desc>
<defs>
  <marker id="arrow-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5" fill="none" stroke="#898781" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arrow-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5" fill="none" stroke="#f0efec" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5" fill="none" stroke="#3987e5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arrow-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5" fill="none" stroke="#d95926" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arrow-aqua" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5" fill="none" stroke="#199e70" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="1200" height="640" rx="16" fill="#0b0f14"/>
<text x="48" y="58" font-size="26" fill="#f0efec" font-weight="700" text-anchor="start">Stretch altitude until the index agrees with air traffic control</text><text x="48" y="88" font-size="16" fill="#c3c2b7" font-weight="400" text-anchor="start">Side view of the same three aircraft. Aircraft are kept 5 NM apart, or 1,000 ft above one another.</text><rect x="48" y="116" width="540" height="484" rx="12" fill="#11161d" stroke="rgba(255,255,255,0.10)" stroke-width="1"/><text x="76" y="156" font-size="19" fill="#f0efec" font-weight="700" text-anchor="start">True scale</text><text x="76" y="181" font-size="14.5" fill="#898781" font-weight="400" text-anchor="start">One kilometre is one kilometre, in every direction</text><rect x="197.62" y="368.0376" width="240.76" height="7.9248" rx="3" fill="rgba(57,135,229,0.18)" stroke="#3987e5" stroke-width="1"/><text x="197.62" y="402" font-size="13" fill="#898781" font-weight="400" text-anchor="start">5 NM</text><text x="438.38" y="402" font-size="13" fill="#898781" font-weight="400" text-anchor="end">5 NM</text><text x="318" y="430" font-size="13.5" fill="#898781" font-weight="400" text-anchor="middle">Protected zone: a disc 10 NM wide and 2,000 ft thick</text><circle cx="318" cy="372" r="6" fill="#d95926" stroke="#11161d" stroke-width="2"/><text x="332" y="362" font-size="15" fill="#f0efec" font-weight="600" text-anchor="start"></text><text x="332" y="381" font-size="13.5" fill="#c3c2b7" font-weight="400" text-anchor="start"></text><text x="306" y="402" font-size="13.5" fill="#c3c2b7" font-weight="400" text-anchor="middle">our flight</text><circle cx="318" cy="368.0376" r="5" fill="#f0efec" stroke="#11161d" stroke-width="2"/><line x1="322" y1="360" x2="358" y2="310" stroke="#898781" stroke-width="1" stroke-linecap="round"/><text x="364" y="296" font-size="15" fill="#f0efec" font-weight="600" text-anchor="start">A: 1,000 ft directly above</text><text x="364" y="315" font-size="13.5" fill="#c3c2b7" font-weight="400" text-anchor="start">0.3 km away</text><circle cx="245.772" cy="372" r="5" fill="#f0efec" stroke="#11161d" stroke-width="2"/><line x1="242.772" y1="362" x2="217.772" y2="310" stroke="#898781" stroke-width="1" stroke-linecap="round"/><text x="225.772" y="286" font-size="15" fill="#f0efec" font-weight="600" text-anchor="middle">B: same level, 3 NM away</text><text x="225.772" y="305" font-size="13.5" fill="#c3c2b7" font-weight="400" text-anchor="middle">5.6 km away</text><rect x="76" y="520" width="484" height="56" rx="8" fill="#19202a" stroke="rgba(255,255,255,0.10)" stroke-width="1"/><text x="96" y="544" font-size="15" fill="#f0efec" font-weight="600" text-anchor="start">The index ranks A as 18 times nearer than B.</text><text x="96" y="564" font-size="14" fill="#c3c2b7" font-weight="400" text-anchor="start">But A is safely separated and B is not.</text><rect x="612" y="116" width="540" height="484" rx="12" fill="#11161d" stroke="rgba(255,255,255,0.10)" stroke-width="1"/><text x="640" y="156" font-size="19" fill="#f0efec" font-weight="700" text-anchor="start">Scaled: 1,000 ft counts as 5 NM</text><text x="640" y="181" font-size="14.5" fill="#898781" font-weight="400" text-anchor="start">Altitude multiplied by 9.26 km per 1,000 ft</text><circle cx="882" cy="356" r="120.38" fill="rgba(57,135,229,0.18)" stroke="#3987e5" stroke-width="1"/><text x="882" y="500.38" font-size="13.5" fill="#898781" font-weight="400" text-anchor="middle">The same protected zone is now a sphere</text><circle cx="882" cy="356" r="6" fill="#d95926" stroke="#11161d" stroke-width="2"/><text x="896" y="346" font-size="15" fill="#f0efec" font-weight="600" text-anchor="start"></text><text x="896" y="365" font-size="13.5" fill="#c3c2b7" font-weight="400" text-anchor="start"></text><text x="894" y="380" font-size="13.5" fill="#c3c2b7" font-weight="400" text-anchor="start">our flight</text><circle cx="882" cy="235.62" r="5" fill="#f0efec" stroke="#11161d" stroke-width="2"/><text x="896" y="227.62" font-size="15" fill="#f0efec" font-weight="600" text-anchor="start">A: 9.3 km away</text><circle cx="809.772" cy="356" r="5" fill="#f0efec" stroke="#11161d" stroke-width="2"/><text x="809.772" y="340" font-size="15" fill="#f0efec" font-weight="600" text-anchor="middle">B: 5.6 km away</text><line x1="817.772" y1="356" x2="874" y2="356" stroke="#c3c2b7" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 4"/><line x1="882" y1="243.62" x2="882" y2="348" stroke="#c3c2b7" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 4"/><rect x="640" y="520" width="484" height="56" rx="8" fill="#19202a" stroke="rgba(255,255,255,0.10)" stroke-width="1"/><text x="660" y="544" font-size="15" fill="#f0efec" font-weight="600" text-anchor="start">Now B is nearer, and A sits exactly on the boundary.</text><text x="660" y="564" font-size="14" fill="#c3c2b7" font-weight="400" text-anchor="start">Nearest in the index means nearest to trouble.</text>
</svg>
